  question: Give me every Beatles song that uses backwards recording.
  expected: The sources here don't say.
  answer: The sources identify “Rain,” “I’m Only Sleeping,” “Tomorrow Never Knows,” “Strawberry Fields
    Forever,” and “Blue Jay Way” as using backwards recording [1][2][3][5][7]. They also mention “Free
    as a Bird” as having reversed vocals, but it was released outside the Beatles’ 1962–1970 period [1].
    The sources don’t establish a complete list of every Beatles song that uses the technique.
  cited_passages:
    '[1] Recording practices of the Beatles > Techniques > Tape manipulation > Backwards tapes': As the
      Beatles pioneered the use of musique concrète in pop music (i.e. the sped-up tape loops in "Tomorrow
      Never Knows"), backward recordings came as a natural exponent of this experimentation. "Rain", the
      first rock song featuring a backwards vocal (Lennon singing the first verse of the song), came about
      when Lennon (claiming the influence of marijuana) accidentally loaded a reel-to-reel tape of the
      song on his machine backwards and essentially liked what he heard so much he quickly had the reversed
      overdubbed. A quick follow-up was the reversed guitar on "I'm Only Sleeping", which features a dual
      guitar solo by George Harrison played backwards. Harrison worked out a guitar part, learned to play
      the part in reverse, and recorded it backwards. Likewise, a backing track of reversed drums and
      cymbals made its way into the verses of "Strawberry Fields Forever". The Beatles' well-known use
      of reversed tapes led to rumours of backwards messages, including many that fueled the Paul is Dead
      urban myth. However, only "Rain" and "Free as a Bird" include intentional reversed vocals in Beatles
      songs.
    '[2] Backmasking > History > Development': The Beatles, which began incorporating musique concrète-inspired
      tape manipulation techniques into their recordings in the mid-1960s, were responsible for popularizing
      the concept of backmasking. Singer John Lennon and producer George Martin both claimed that they
      had discovered the backwards recording technique during the recording of 1966's Revolver (specifically
      the album tracks "Tomorrow Never Knows" and "I'm Only Sleeping") and the single "Rain". Lennon stated
      that, while under the influence of marijuana, he accidentally played "Rain" in reverse and enjoyed
      the sound. After sharing the results with the other Beatles, the effect was used on tape loops and
      the guitar solo on "Tomorrow Never Knows" and later on Lennon's vocals in the coda of "Rain". According
      to Martin, the band had been experimenting with changing the speeds of and reversing the "Tomorrow
      Never Knows" tapes, and Martin got the idea of reversing Lennon's vocals and guitar, which he did
      with a clip from "Rain". Lennon then liked the effect and kept it.
    '[3] Recording practices of the Beatles > Techniques > Tape manipulation > Backwards tapes': The stereo
      version of George Harrison's "Blue Jay Way" (1967, Magical Mystery Tour) also includes backwards
      vocals, which is actually a backwards copy of the entire mix, including all instruments, which is
      faded up at the end of each phrase.
    '[5] Tomorrow Never Knows > Recording': 'Further to their approach when recording Rubber Soul late
      the previous year, the Beatles and Martin embraced the idea of the recording studio as an instrument
      on Revolver, particularly "Tomorrow Never Knows". As Lennon hated doing a second take to double
      his vocals, Ken Townsend, the studio''s technical manager, developed an alternative form of double-tracking
      called artificial double tracking (ADT) system, taking the signal from the sync head of one tape
      machine and delaying it slightly through a second tape machine. The two tape machines used were
      not driven by mains electricity, but from a separate generator which put out a particular frequency,
      the same for both, thereby keeping them locked together. By altering the speed and frequencies,
      he could create various effects, which the Beatles used throughout the recording of Revolver. Lennon''s
      vocal is double-tracked on the first three verses of the song: the effect of the Leslie cabinet
      can be heard after the (backwards) guitar solo.


      The track includes the highly compressed drums that the Beatles favoured at the time, with reverse
      cymbals, reverse guitar, processed vocals, looped tape effects, and sitar and tambura drone.'
    '[7] Blue Jay Way > Production > Studio effects': '"Blue Jay Way" features extensive use of three
      studio techniques employed by the Beatles over 1966–67: flanging, an audio delay effect; sound-signal
      rotation via a Leslie speaker; and (in the stereo mix only) reversed tapes. Beatles historian Mark
      Lewisohn compares "Blue Jay Way" with two Lennon tracks from this period, "Strawberry Fields Forever"
      and "I Am the Walrus", in that the recording "seized upon all the studio trickery and technical
      advancements of 1966 and 1967 and captured them in one song". Together with the pedal drone supplied
      by the keyboard parts, the various sound treatments reinforce the sense of dislocation evident in
      the song.


      In the case of the reversed-tape technique, a recording of the completed track was played backwards
      and faded in at key points during the performance. This effect created a response to Harrison''s
      lead vocal over the verses, as the backing vocals appear to answer each line he sings. Due to the
      limits of multitracking, the process of feeding in reversed sounds was carried out live during the
      final mixing session.'
