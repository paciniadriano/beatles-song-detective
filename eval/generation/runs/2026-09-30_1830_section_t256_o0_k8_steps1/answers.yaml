    '[3] A Day in the Life > Musical structure and development > Orchestra': 'The recording session was
      completed at a total cost of £367 (equivalent to £ in ) for the players, an extravagance at the
      time. Martin later described explaining his score to the puzzled orchestra:


      What I did there was to write ... the lowest possible note for each of the instruments in the orchestra.
      At the end of the twenty-four bars, I wrote the highest note ... near a chord of E major. Then I
      put a squiggly line right through the twenty-four bars, with reference points to tell them roughly
      what note they should have reached during each bar ... Of course, they all looked at me as though
      I were completely mad.


      McCartney had originally wanted a 90-piece orchestra, but this proved impossible. Instead, the semi-improvised
      segment was recorded several times, filling a separate four-track tape machine, and the four different
      recordings were overdubbed into a single massive crescendo. The results were successful; in the
      final edit of the song, the orchestral bridge is reprised after the final verse.'
    '[1] A Day in the Life > Musical structure and development > Orchestra': The orchestral portions of
      "A Day in the Life" reflect Lennon and McCartney's interest in the work of avant-garde composers
      such as Karlheinz Stockhausen, Luciano Berio and John Cage. To fill the empty 24-bar middle section,
      Lennon's request to George Martin was that the orchestra should provide "a tremendous build-up,
      from nothing up to something absolutely like the end of the world". McCartney suggested having the
      musicians improvise over the segment. To allay concerns that classically trained musicians would
      be unable to do this, Martin wrote a loose score for the section. Using the rhythm implied by Lennon's
      staggered intonation on the words "turn you on", the score was an extended, atonal crescendo that
