      partners on the meditation course, Lennon and George Harrison, attempted to coax Farrow out of her
      seclusion, which led to Lennon writing the song.


      Lennon wrote "Dear Prudence" using a finger-picking guitar technique that he learned from singer-songwriter
      Donovan. Its lyrics are simple and innocent and celebrate the beauty of nature. The Beatles recorded
      the song at Trident Studios in late August 1968 as a three-piece after Ringo Starr temporarily left
      the group out of protest at McCartney''s criticism of his drumming on "Back in the U.S.S.R." and
      the tensions that typified the sessions for the White Album.'
    '[2] Dear Prudence > Recording > Studio recording': 'The Beatles formally recorded the song at Trident
      Studios in London from 28 to 30 August. This period was marked by tension and hostility within the
      group, which had led to Ringo Starr temporarily leaving the band during the recent sessions for
      McCartney''s song "Back in the U.S.S.R." On 28 August, the three remaining Beatles completed the
      basic track for "Dear Prudence", comprising various guitar parts by Lennon and Harrison, including
      Lennon''s finger-picked electric rhythm part, and McCartney on drums in place of Starr. Using eight-track
