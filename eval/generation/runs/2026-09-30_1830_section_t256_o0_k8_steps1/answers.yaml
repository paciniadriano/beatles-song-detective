  cited_passages:
    '[1] Automatic double tracking > Invention': 'ADT was invented specially for the Beatles during the
      spring of 1966 by Ken Townsend, a recording engineer employed at EMI''s Abbey Road Studios, mainly
      at the request of John Lennon, who despised the tedium of double tracking during sessions and regularly
      expressed a desire for a technical alternative.


      Townsend came up with a system using tape delay, . Townsend''s system added a second tape recorder
      to the regular setup. When mixing a song, its vocal track was routed from the recording head of
      the multitrack tape, located before the playback head, and fed to the record head of the second
      tape recorder. An oscillator was used to vary the speed of the second machine, providing variation
      in delay and pitch depending on the change in the second machine speed. This signal was then routed
      from the playback head of the second machine to a separate channel on the mixer. This allowed the
      vocal delayed by a few milliseconds to be combined with the normal vocal, creating the double-tracked
      effect.'
    '[3] Revolver (Beatles album) > Production techniques > Innovations': 'There are sounds [on Revolver]
      that nobody else has done yet – I mean nobody ... ever.

      Mark Brend writes that, with Revolver, the Beatles advanced Meek''s strategy of employing the recording
      studio as a musical instrument and "formalized this approach into what is now an accepted option
      for pop music making". A key production technique they used was automatic double tracking (ADT),
      which EMI technical engineer Ken Townsend invented on 6 April. This technique employed two linked
      tape recorders to automatically create a doubled vocal track. The standard method had been to double
