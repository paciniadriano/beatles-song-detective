  cited_passages:
    '[1] Dear Prudence > Introduction': '"Dear Prudence" is a song by the English rock band the Beatles
      from their 1968 double album The Beatles (also known as "the White Album"). The song was written
      by John Lennon and credited to the Lennon–McCartney partnership. Written in Rishikesh during the
      group''s trip to India in early 1968, it was inspired by actress Mia Farrow''s sister, Prudence
