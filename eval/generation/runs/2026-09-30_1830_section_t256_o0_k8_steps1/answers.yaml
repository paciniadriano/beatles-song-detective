      were unreleased tracks from other projects. The album was recorded before – and issued two months
      after – the band''s self-titled double LP (also known as the "White Album") and was not viewed by
      the band as a significant release. An EP containing only the new songs had been considered, and
      was mastered, but left unreleased. The original mono mixes were later included in the 2009 compilation
      Mono Masters.'
