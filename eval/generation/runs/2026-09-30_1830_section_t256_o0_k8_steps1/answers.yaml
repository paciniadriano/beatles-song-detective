- question_id: gen_060
  kind: detail
  question: Which studio tricks shaped the sound of Revolver?
  expected: Automatic double tracking, varispeed, reversed tapes, close miking and instruments outside
    their live set-up.
  article: Revolver (Beatles album)
  evidence: the band made liberal use of automatic double tracking, varispeed, reversed tapes, close audio
    miking, and instruments outside of their standard live set-up.
  answer: 'Several studio tricks helped shape *Revolver*: automatic double tracking (ADT) thickened vocals
    and colored some instruments, while tape was played backwards or at altered speeds for unusual sounds
    [2][4][8]. The album also used tape loops, processed vocals, and a Leslie speaker effect, especially
    on “Tomorrow Never Knows” [1][5]. Close-miking and compression gave the drums and strings a more forceful
    sound [3].'
  cited_passages:
    '[2] Revolver (Beatles album) > Production techniques > Innovations': 'There are sounds [on Revolver]
      that nobody else has done yet – I mean nobody ... ever.

      Mark Brend writes that, with Revolver, the Beatles advanced Meek''s strategy of employing the recording
      studio as a musical instrument and "formalized this approach into what is now an accepted option
      for pop music making". A key production technique they used was automatic double tracking (ADT),
      which EMI technical engineer Ken Townsend invented on 6 April. This technique employed two linked
      tape recorders to automatically create a doubled vocal track. The standard method had been to double
      the vocal by singing the same piece twice onto a multitrack tape, a task Lennon particularly disliked.
      The Beatles were delighted with the invention, and used it extensively on Revolver. ADT soon became
      a standard pop production technique, and led to related developments such as the artificial chorus
      effect.


      The band''s most experimental work during the sessions was channelled into the first song they attempted,
      "Tomorrow Never Knows". Lennon sang his vocal for the song through the twin revolving speakers inside
      a Leslie cabinet, which was designed for use with a Hammond organ.'
    '[4] Revolver (Beatles album) > Production techniques > Studio aesthetic': 'Revolver very rapidly
      became the album where the Beatles would say, "OK, that sounds great, now let''s play [the recording]
      backwards or speeded up or slowed down." They tried everything backwards, just to see what things
      sounded like.

      The sessions for Revolver furthered the spirit of studio experimentation that was evident on Rubber
      Soul. With the Beatles increasingly involved in the production of their music, Martin''s role as
      producer had changed to one of a facilitator and collaborator, whereby the band now relied on him
      to make their ideas a reality. According to Robert Rodriguez, Revolver marked the first time the
      Beatles integrated studio technology into the "conception of the recordings they made". He views
      this approach as reflective of the group''s waning interest in live performance before crowds of
      screaming fans, "in favor of creating soundscapes without limitation" in a studio environment. For
      the first time at EMI Studios, the company''s four-track tape machines were placed in the studio''s
      control room, alongside the producer and balance engineer, rather than in a dedicated machine room.'
    '[8] Automatic double tracking > Use by the Beatles': 'The Beatles were ecstatic over Townsend''s
      technique and used it throughout their 1966 album Revolver and on many of their subsequent recordings.
      It has been incorrectly claimed that the first use of ADT was on the first half of Lennon''s vocal
      track on "Tomorrow Never Knows", but in actuality, this vocal track features manual double tracking.
      Most of the double-tracked vocals heard on the rest of the album were created using ADT, while the
      group also used the technique on a number of the instrumental parts to colour the sounds – there
      is factually more use of ADT on the mono version of the album than on the more widely known stereo
      version, with the lead guitar on "Taxman" and the backwards guitar on "I''m Only Sleeping" treated
      with the effect.


      When used on a stereo mix, ADT could be used to create the impression of two different vocal parts
      on either side of the stereo picture.'
    '[1] Tomorrow Never Knows > Recording': 'Further to their approach when recording Rubber Soul late
      the previous year, the Beatles and Martin embraced the idea of the recording studio as an instrument
      on Revolver, particularly "Tomorrow Never Knows". As Lennon hated doing a second take to double
      his vocals, Ken Townsend, the studio''s technical manager, developed an alternative form of double-tracking
      called artificial double tracking (ADT) system, taking the signal from the sync head of one tape
      machine and delaying it slightly through a second tape machine. The two tape machines used were
      not driven by mains electricity, but from a separate generator which put out a particular frequency,
      the same for both, thereby keeping them locked together. By altering the speed and frequencies,
      he could create various effects, which the Beatles used throughout the recording of Revolver. Lennon''s
      vocal is double-tracked on the first three verses of the song: the effect of the Leslie cabinet
      can be heard after the (backwards) guitar solo.


      The track includes the highly compressed drums that the Beatles favoured at the time, with reverse
      cymbals, reverse guitar, processed vocals, looped tape effects, and sitar and tambura drone.'
    '[5] George Martin > Career > The Beatles > Shift to studio experimenting (1965–1966)': 'And now,
      we really were beginning to think about albums as a bit of art in their own right. We were thinking
      about the album as an entity of its own, and Rubber Soul was the first one to emerge in this way.


      The Beatles re-entered EMI Studios in April 1966, with the group''s exploration of recording at
      Stax Records'' studio in Memphis. The sessions of the Revolver album began with a highly experimental
      track, "Tomorrow Never Knows"—a Lennon song inspired by Timothy Leary''s book The Psychedelic Experience.
      The song featured several innovations in pop recording, including the use of a tanpura drone loop
      throughout the song, a backwards guitar solo, sped-up tape loops, and artificial double tracking
      (ADT) on Lennon''s vocal. Martin worked closely with EMI engineers Geoff Emerick and Ken Townsend
      to achieve these radical effects.'
    '[3] Revolver (Beatles album) > Production techniques > Innovations': 'Emerick also ensured a greater
      presence for Starr''s bass drum, by inserting an item of clothing inside the structure, to dampen
      the sound, and then moving the microphone to just 3 inches from the drumhead and compressing the
      signal through a Fairchild limiter. MacDonald writes that although EMI Studios was technically inferior
      to many recording facilities in the United States, Starr''s drumming on the album soon led to studios
      there "being torn apart and put back together again", as engineers sought to replicate the innovative
      sounds achieved by the Beatles. The preference for close-miking instruments extended to the orchestral
      strings used on "Eleanor Rigby", to achieve McCartney''s request for a "really biting" sound, and
      the horns on "Got to Get You into My Life". This was another break from convention, and alarmed
      the classically trained string players.


      Kevin Ryan and Brian Kehew wrote that the Revolver sessions introduced nine techniques to the recording
      world, including ADT, backwards recording, and close-miked drums. They quote Emerick as saying:
      "I know for a fact that, from the day it came out, Revolver changed the way that everyone else made
      records."'
