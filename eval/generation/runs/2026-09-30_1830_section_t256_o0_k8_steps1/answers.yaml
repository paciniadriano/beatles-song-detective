  article: Rubber Soul
  evidence: The title derives from the colloquialism "plastic soul" and was the Beatles' way of acknowledging
    their lack of authenticity compared to the African-American soul artists they admired.
  answer: The title grew out of the phrase “plastic soul,” which Paul McCartney recalled hearing an American
    musician use about Mick Jagger’s singing. “Rubber Soul” was a pun on that phrase, combining the idea
    of pop music’s artificiality with rubber-soled shoes; the Beatles also used it to acknowledge that
    they couldn’t match the soul of the American artists they admired [1][7].
  cited_passages:
    '[1] Rubber Soul > Title and artwork': 'The album title was intended as a pun combining the falseness
      intrinsic to pop music and rubber-soled shoes. Lennon said the title was McCartney''s idea and referred
      to "English soul". In a 1966 press conference, Starr said they called the album Rubber Soul to acknowledge
      that, in comparison to American soul artists, "we are white and haven''t got what they''ve got",
      and he added that this was true of all the British acts who attempted to play soul music. McCartney
      recalled that he conceived the title after overhearing an American musician describing Mick Jagger''s
      singing style as "plastic soul". In Phillip Norman''s view, the title served as "a sly dig at their
      archrivals (and private best mates) the Rolling Stones", with the added implication that the Beatles''
      "variety" of soul music "at least was stamped out by a good strong northern [English] Wellington
      boot".


      Rubber Soul was the group''s first album not to feature their name on the cover, an omission that
      reflected the level of control they had over their releases and the extent of their international
      fame.'
    '[7] Rubber Soul > Introduction': 'Rubber Soul is the sixth studio album by the English rock band
      the Beatles. It was released on 3 December 1965 in the United Kingdom on EMI''s Parlophone label,
      accompanied by the non-album double A-side single "We Can Work It Out" / "Day Tripper". The original
      North American release, issued by Capitol Records, contains ten of the fourteen songs and two tracks
      withheld from the band''s Help! (1965) album. Rubber Soul was described as an important artistic
      achievement by the band, meeting a highly favourable critical response and topping sales charts
      in Britain and the United States for several weeks.


      The recording sessions took place in London over a four-week period beginning in October 1965. For
      the first time in their career, the Beatles were able to record an album free of concert, radio
      or film commitments. Often referred to as a folk rock album, particularly in its Capitol configuration,
      Rubber Soul incorporates a mix of pop, soul and folk musical styles. The title derives from the
      colloquialism "plastic soul" and was the Beatles'' way of acknowledging their lack of authenticity
      compared to the African-American soul artists they admired.'
