# The corpus: every English Wikipedia article that enters it, grouped by the
# doc_type it gets. Nothing is resolved from categories: what is listed here is
# the whole corpus, so a later fetch can never add a page nobody chose.
#
# Titles must be Wikipedia's canonical titles, not redirects: fetch.py refuses a
# redirect and prints the title to use instead. normalize.py looks each raw file
# up here by that title, which is why doc_type and the rules below live in this
# file and nowhere else.
#
# Songs are grouped by album, and the group is the song's Album header and
# filter value. The album is the first of the album articles below on which the
# Beatles released the song: the original albums as first issued (Magical
# Mystery Tour as the 11-track LP), in track order. A song the Beatles first
# released on an Anthology set, in 1995-96, takes that set. Anything else (a
# single, an EP, a later compilation, never released) is Single/Outtake. Every
# group except Single/Outtake must name an album article.
#
# An entry is either a plain title or a mapping with per-article rules:
#   keep_sections  keep only the sections whose path names one of these phrases
#                  (whole words, ignoring case). The text before the first
#                  heading is the section "Introduction". Every phrase must
#                  match at least one section, so a heading that changed or a
#                  wrong article fails loudly. Covers use it to keep only the
#                  sections about the Beatles' version.
#   name           the name shown in the header when the article title differs
#                  from the Beatles' own title for the song.

# Songs are grouped by album: each group is the song's Album header and filter
# value (the rule is at the top of this file).
